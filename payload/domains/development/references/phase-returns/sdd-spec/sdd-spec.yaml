# matecito-ai: shape of the `sdd-spec` return. The spec ARTIFACT is the delta itself and is a
# different document; this block is what the orchestrator gates on. Meaning in `sdd-spec.md`.
phase: sdd-spec
block: "## Specs Created"
statuses: [done, blocked]
header:
  - { label: Change, field: change }
sections:
  - title: "### Specs Written"
    emitted: always
    sentinel: true
    render: table
    field: specs_written
    columns:
      - { key: domain, label: Domain }
      - { key: type, label: Type }
      - { key: requirements, label: Requirements }
      - { key: scenarios, label: Scenarios }
  - title: "### Coverage"
    emitted: always
    render: labeled-bullets
    bullets:
      - { label: Happy paths, field: coverage.happy_paths }
      - { label: Edge cases, field: coverage.edge_cases }
      - { label: Error states, field: coverage.error_states }
      # Two legal forms only: a count, or `none — ui-test: not-needed`. There is no "could not author
      # it" case: the behavioral half needs nothing that does not exist yet.
      - { label: UI scenarios, field: coverage.ui_scenarios }
  - title: "### Blocker"
    emitted: on-status
    statuses: [blocked]
    render: fields
    lead: blocker.question
    fields:
      - { label: Options weighed, field: blocker.options }
      - { label: Why this is not mine to settle, field: blocker.why_not_mine }
      - { label: What unblocks it, field: blocker.what_unblocks }
  - title: "### Derived capabilities (unconfirmed)"
    emitted: always
    tier: 1
    sentinel: true
    render: items
    field: derived_capabilities
    items: { text: summary, rationale: rationale }
  - title: "### Next Step"
    emitted: always
    render: line
    field: next_step

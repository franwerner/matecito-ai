# matecito-ai: shape of the `sdd-propose` return. `sdd-propose.md` is the authority on MEANING.
# `validate-return.js --self-check` fails when the two stop agreeing.
phase: sdd-propose
block: "## Proposal Created"
statuses: [done, blocked]
header:
  - { label: Change, field: change }
  - { label: Location, field: location }
sections:
  - title: "### Summary"
    emitted: always
    render: line
    field: summary
  - title: "### Scope and approach (unconfirmed)"
    emitted: always
    tier: 1
    sentinel: true
    render: items
    field: scope_unconfirmed
    items:
      text: summary
      rationale: rationale
      summary_max: 250
      tokens:
        - { name: anchor, field: anchor }
  # matecito-ai: contract-shape-gate. An unpinned contract/definition — the shape "Contract &
  # definition shapes — never inferred" (domain CLAUDE.md) forbids guessing — proposed as one
  # compound item, never as free prose inside `### Blocker`. Both conditions must hold: the phase's
  # own `has_contract_proposals` declaration AND `status: blocked`.
  - title: "### Contract Shapes Proposed"
    emitted: conditional
    when: has_contract_proposals
    statuses: [blocked]
    render: items
    field: contract_proposals
    items:
      text: summary
      rationale: rationale
      summary_max: 250
      fields: { key: field, parts: [name, type, description], separator: " — ", field_max: 160 }
      tokens:
        - { name: anchor, field: anchor }
  - title: "### Blocker"
    emitted: on-status
    statuses: [blocked]
    render: fields
    lead: blocker.question
    fields:
      - { label: Options weighed, field: blocker.options }
      - { label: What unblocks it, field: blocker.what_unblocks }
  - title: "### Next Step"
    emitted: always
    render: line
    field: next_step

# matecito-ai: shape of the `sdd-apply` return. The apply-progress ARTIFACT is cumulative across
# batches and carries more than this block (the UI counterparts, the file list verify reads).
# Meaning in `sdd-apply.md`.
phase: sdd-apply
block: "## Implementation Progress"
statuses: [done, partial, blocked]
header:
  - { label: Change, field: change }
  - { label: Mode, field: mode }
sections:
  - title: "### Completed Tasks"
    emitted: always
    sentinel: true
    render: items
    field: completed_tasks
    items: { text: text }
  - title: "### Files Changed"
    emitted: always
    sentinel: true
    render: table
    field: files_changed
    columns:
      - { key: file, label: File }
      - { key: task, label: Task }
      - { key: action, label: Action }
  # In-flow decision capture (development-specifics; see ../../decision-capture/in-flow-capture.md).
  # Emitted only when this run materialized at least one ratified proposal — a run that materialized
  # nothing carries no section at all, not even the sentinel (same shape as the two TDD sections below).
  - title: "### Decisions Materialized"
    emitted: conditional
    when: has_decisions_materialized
    render: table
    field: decisions_materialized
    columns:
      - { key: record, label: Record }
      - { key: task, label: Task }
      - { key: result, label: Result }
  # In-flow decision capture, rejection half (see ../../decision-capture/in-flow-capture.md and
  # ../../../CLAUDE.md's "Forwarding a proposal's resolution to `sdd-apply`"). `has_forwarded_rejections`
  # is a fact about the PROMPT, never derived from the list: `true` + an empty list is the omission case
  # (every forwarded rejection was checked and none conflicted), `false` is "nothing forwarded" — the
  # renderer refuses to guess it, so this run answers the question on every batch that reaches a task a
  # rejection governs. Both `design-conflict` values are `passing`: a non-passing value would make the
  # render fail exactly when the run is trying to report an honest conflict.
  - title: "### Rejected Proposals Checked"
    emitted: conditional
    when: has_forwarded_rejections
    render: items
    field: rejected_proposals
    items:
      text: summary
      rationale: rationale
      summary_max: 250
      tokens:
        - { name: anchor, field: anchor }
        - { name: record, field: record }
        - { name: design-conflict, field: design_conflict, values: [none, conflicts], passing: [none, conflicts] }
  # Gated on Strict TDD, which the `Mode` header states. Absent outside it, and that is legitimate.
  - title: "### TDD Cycle Evidence"
    emitted: conditional
    when: strict_tdd
    render: table
    field: tdd_evidence
    columns:
      - { key: task, label: Task }
      - { key: red, label: RED }
      - { key: green, label: GREEN }
      - { key: refactor, label: REFACTOR }
  - title: "### Test Summary"
    emitted: conditional
    when: strict_tdd
    render: line
    field: test_summary
  # A fork the confirmed artifacts do not fix, admitting more than one valid resolution: not applied,
  # travels back as a question. `mandate` here is legal only as `chosen` — any other value is in the
  # wrong section and belongs in `### Mandated Departures` below.
  - title: "### Unmandated Forks"
    emitted: always
    tier: 1
    sentinel: true
    render: items
    field: unmandated_forks
    items:
      text: summary
      rationale: rationale
      summary_max: 250
      tokens:
        - { name: anchor, field: anchor }
        - { name: mandate, field: mandate, values: [covered, forced, chosen], passing: [chosen] }
        - { name: verify-checks, field: verify_checks, values: [yes, no], passing: [yes, no] }
  # A deviation that WAS applied — either a confirmed artifact fixed it (`covered`) or no alternative
  # was valid and the constraint is named (`forced`). `verify-checks` keeps both values legal here:
  # this mailbox reports accomplished facts, and the token only tells `sdd-verify` how to classify
  # each one.
  - title: "### Mandated Departures"
    emitted: always
    tier: 2
    sentinel: true
    render: items
    field: mandated_departures
    items:
      text: summary
      rationale: rationale
      summary_max: 250
      tokens:
        - { name: anchor, field: anchor }
        - { name: mandate, field: mandate, values: [covered, forced, chosen], passing: [covered, forced] }
        - { name: verify-checks, field: verify_checks, values: [yes, no], passing: [yes, no] }
  # matecito-ai: contract-shape-gate. An unpinned contract/definition — the shape "Contract &
  # definition shapes — never inferred" (domain CLAUDE.md) forbids guessing — proposed as one
  # compound item, never as free prose inside `### Blocker`. Both conditions must hold: the phase's
  # own `has_contract_proposals` declaration AND `status: blocked`.
  - title: "### Contract Shapes Proposed"
    emitted: conditional
    when: has_contract_proposals
    statuses: [blocked]
    render: items
    field: contract_proposals
    items:
      text: summary
      rationale: rationale
      summary_max: 250
      fields: { key: field, parts: [name, type, description], separator: " — ", field_max: 160 }
      tokens:
        - { name: anchor, field: anchor }
  - title: "### Blocker"
    emitted: conditional
    when: has_blocker
    render: fields
    lead: blocker.question
    fields:
      - { label: Options weighed, field: blocker.options }
      - { label: What unblocks it, field: blocker.what_unblocks }
  - title: "### Issues Found"
    emitted: always
    sentinel: true
    render: items
    field: issues
    items: { text: text }
  - title: "### Remaining Tasks"
    emitted: always
    sentinel: true
    render: items
    field: remaining_tasks
    items: { text: text }
  - title: "### Workload / PR Boundary"
    emitted: always
    render: labeled-bullets
    bullets:
      - { label: Mode, field: workload.mode }
      - { label: Boundary, field: workload.boundary }
  - title: "### Status"
    emitted: always
    render: line
    field: status_line

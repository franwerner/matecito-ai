# matecito-ai: the return contract of `sdd-design` as data. `render-return.js` builds the block from
# it, so the shape is correct by construction: a section cannot be dropped, re-levelled, or left
# without its sentinel, because the agent never types a heading.
#
# The `.md` next to this file stays the authority on MEANING — what belongs in each section and why.
# This file is the authority on SHAPE. `validate-return.js --self-check` fails when the two stop
# agreeing; run it whenever you edit either file.
#
# Derived fields are NOT inputs: the renderer computes them. That is what makes a summary that
# contradicts its own body impossible to express rather than merely detectable.

phase: sdd-design
block: "## Design Created"
statuses: [done, blocked]

header:
  - label: Change
    field: change
  - label: Location
    field: location

sections:
  - title: "### Summary"
    emitted: always
    render: labeled-bullets
    bullets:
      - label: Approach
        field: summary.approach
      - label: Key Decisions
        derived: "count:new_decisions"
        format: "{n} documented"
      - label: Files Affected
        field: summary.files_affected
        format: "{new} new, {modified} modified, {deleted} deleted"
      - label: Testing Strategy
        field: summary.testing_strategy

  # matecito-ai: contract-shape-gate. An unpinned contract/definition — the shape "Contract &
  # definition shapes — never inferred" (domain CLAUDE.md) forbids guessing — proposed as one
  # compound item, never as free prose inside `### Blocker`. Both conditions must hold: the phase's
  # own `has_contract_proposals` declaration AND `status: blocked`.
  - title: "### Contract Shapes Proposed"
    emitted: conditional
    when: has_contract_proposals
    statuses: [blocked]
    render: items
    field: contract_proposals
    items:
      text: summary
      rationale: rationale
      summary_max: 250
      fields: { key: field, parts: [name, type, description], separator: " — ", field_max: 160 }
      tokens:
        - { name: anchor, field: anchor }

  - title: "### Blocker"
    emitted: on-status
    statuses: [blocked]
    render: fields
    lead: blocker.question
    fields:
      - label: Options weighed
        field: blocker.options
      - label: Why this is not mine to settle
        field: blocker.why_not_mine
      - label: What unblocks it
        field: blocker.what_unblocks

  - title: "### New Decisions"
    emitted: always
    accepts: ["### New Decisions (not yet in EDRs)"]
    variant:
      title: "### New Decisions (not yet in EDRs)"
      when: decision_store_active
    tier: 1
    sentinel: true
    render: items
    field: new_decisions
    items:
      text: summary
      rationale: rationale
      summary_max: 250
      # In-flow decision capture (development-specifics; see ../../decision-capture/in-flow-capture.md).
      # `record` is free-form (`<domain>/<slug>`, no `values`) — any present, non-null value passes;
      # still required (`TOKEN-MISSING` when absent). `blocking-test` is unchanged. `anchor` is free-form
      # too, declared first so it prints adjacent to the summary.
      tokens:
        - { name: anchor, field: anchor }
        - { name: blocking-test, field: blocking_test, values: [none, infra, contract, data-model], passing: [none] }
        - { name: record, field: record }

  - title: "### Open Questions"
    emitted: always
    tier: 2
    sentinel: true
    render: items
    field: open_questions
    items:
      text: summary
      rationale: rationale
      summary_max: 250
      tokens:
        - { name: anchor, field: anchor }

  - title: "### Next Step"
    emitted: always
    render: line
    field: next_step

# Read by the validator when a return was written by hand instead of rendered.
summary_claims:
  - section: "### New Decisions"
    pattern: "Key Decisions"

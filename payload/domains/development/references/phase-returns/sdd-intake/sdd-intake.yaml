# matecito-ai: shape of the `sdd-intake` return. This phase is now a single-pass passthrough — no
# discovery form, no size, no triage — so it carries one block, like every other phase. Meaning lives
# in `sdd-intake.md`.

phase: sdd-intake
statuses: [done, needs-decision, blocked]
block: "## Intake Brief: {title}"
sections:
  - title: "### Request (structured)"
    emitted: always
    render: line
    field: request_structured
  # The three downstream flags live here and nowhere else. `sdd-design` reads `Diagram` and
  # `sdd-spec`/`sdd-verify` read `UI test`; each treats an absent flag as not-needed, silently.
  # `Components` has no phase reader (metadata, decided and reported, never ratified) and is gated by
  # `components_axis_active`: presence-based on `repo.components`, never inherited from global config.
  # Resolved false, the bullet is legitimately absent; omitted, the render fails.
  - title: "### Classification"
    emitted: always
    render: labeled-bullets
    bullets:
      - { label: Type, field: classification.type }
      - { label: Domains touched, field: classification.domains }
      - { label: Diagram, field: classification.diagram }
      - { label: UI test, field: classification.ui_test }
      - { label: Components, field: classification.components, emitted: conditional, when: components_axis_active }
  # Conditional on the STORE: absent or empty means decision records are not mentioned anywhere.
  - title: "### Early guard (EDRs)"
    emitted: conditional
    when: edr_store_active
    render: line
    field: early_guard
  - title: "### Next"
    emitted: always
    render: line
    field: next

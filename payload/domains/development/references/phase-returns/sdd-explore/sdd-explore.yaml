# matecito-ai: shape of the `sdd-explore` return. This phase runs a Discovery Form on `needs-input`
# ONLY when Pass 1 finds real questions; with none, it proceeds straight to the Exploration on `done`
# in that same pass — mirroring `sdd-intake`'s prior contract, so the shape is split into `variants`
# keyed by status the same way. Note this phase's artifact IS the `[done, blocked]` block, so what you
# trim there you also trim from what the next phase reads. Meaning lives in `sdd-explore.md`.
phase: sdd-explore
statuses: [needs-input, done, blocked]

variants:
  - statuses: [needs-input]
    block: "## Discovery Form: {topic}"
    sections:
      - title: "### Request (as received)"
        emitted: always
        render: line
        field: request_raw
      # Never empty: this block is emitted only when Pass 1 found real questions. Nothing ambiguous
      # means this block is never reached at all — the phase proceeds to `## Exploration` with `done`.
      - title: "### Questions (unanswered — for the orchestrator to ask)"
        emitted: always
        sentinel: true
        render: items
        field: questions
        items:
          text: text
          # Free-form, same shape `sdd-design.yaml` declares for its own `anchor` token — no `values`,
          # still required. A question grounded in something explore read anchors to the repo path it
          # came from; a question about the request's own intent anchors to the intake brief's key.
          tokens:
            - { name: anchor, field: anchor }
      - title: "### Next"
        emitted: always
        render: line
        field: next

  - statuses: [done, blocked]
    block: "## Exploration: {topic}"
    sections:
      - title: "### Current State"
        emitted: always
        render: line
        field: current_state
      # The user's discovery answers, carried verbatim — replaces `sdd-intake`'s section of the same
      # name, which no longer exists now that intake is a single-pass passthrough.
      - title: "### Discovery answers"
        emitted: always
        sentinel: true
        render: items
        field: discovery_answers
        items: { text: text }
      - title: "### Affected Areas"
        emitted: always
        sentinel: true
        render: items
        field: affected_areas
        items: { text: text }
      - title: "### Approaches"
        emitted: always
        sentinel: true
        render: table
        field: approaches
        columns:
          - { key: approach, label: Approach }
          - { key: pros, label: Pros }
          - { key: cons, label: Cons }
      - title: "### Recommendation"
        emitted: always
        render: line
        field: recommendation
      - title: "### Risks"
        emitted: always
        sentinel: true
        render: items
        field: risks
        items: { text: text }
      - title: "### Blocker"
        emitted: on-status
        statuses: [blocked]
        render: fields
        lead: blocker.question
        fields:
          - { label: What unblocks it, field: blocker.what_unblocks }
      - title: "### Ready for Proposal"
        emitted: always
        render: line
        field: ready_for_proposal

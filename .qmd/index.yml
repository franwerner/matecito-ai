global_context: "matecito-ai — records durables del proyecto: el comportamiento del sistema (capability-specs) y las decisiones de ingeniería (EDRs) que lo gobiernan."

collections:
  records:
    path: /home/ifran/proyectos/matecito-ai/.matecito-ai
    pattern: "**/*.md"
    ignore:
      - "**/INDEX.md"
    includeByDefault: true
    context:
      "/": "Los records durables del proyecto, en dos stores."
      "/development-specs": "Capability-specs: QUÉ hace el sistema ante cada situación, por tipo (flow, rule, lifecycle, process), con escenarios verificables. Es el contrato de comportamiento."
      "/edr": "EDRs: POR QUÉ de cada elección técnica, por dominio (contracts, structure, tech). Contexto, decisión, alternativas y consecuencias."

models:

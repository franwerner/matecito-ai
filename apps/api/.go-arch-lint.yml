version: 3

allow:
  # every external dependency must be declared and granted per component
  depOnAnyVendor: false

excludeFiles:
  - "^.*_test\\.go$"

vendors:
  ent:    { in: [ entgo.io/ent, entgo.io/ent/** ] }
  atlas:  { in: ariga.io/atlas/** }
  sqlite: { in: modernc.org/sqlite }
  uuid:   { in: github.com/google/uuid }

components:
  main:       { in: cmd/broker }
  config:     { in: internal/config }
  transport:  { in: internal/transport }
  ingest:     { in: internal/ingest }
  store:      { in: internal/store }
  store-ent:  { in: [ internal/store/ent, internal/store/ent/** ] }
  store-migr: { in: internal/store/migrations }
  # build-time only (//go:build ignore): derives the migrations, never linked
  # into the binary — hence its own component instead of widening store-migr
  migr-gen:   { in: internal/store/migrations/generate }

# config and store-migr are absent on purpose: they depend on nothing but the
# standard library, and the schema rejects an empty mayDependOn list.
deps:
  main:
    mayDependOn:
      - config
      - store
      - transport

  transport:
    mayDependOn:
      - store

  ingest:
    mayDependOn:
      - store

  store:
    mayDependOn:
      - store-ent
      - store-migr
    canUse:
      - ent
      - atlas
      - sqlite
      - uuid

  # generated by ent; its own imports are not ours to constrain
  store-ent:
    anyVendorDeps: true
    mayDependOn:
      - store-ent

  migr-gen:
    mayDependOn:
      - store-ent
    canUse:
      - ent
      - atlas
      - sqlite

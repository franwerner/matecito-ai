<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
</helmet>
<div style="position:relative;width:100%;height:100%;min-height:80px;display:flex;align-items:center;justify-content:center">
  <svg viewBox="0 0 220 80" width="100%" height="100%" preserveAspectRatio="none" style="position:absolute;inset:0;overflow:visible">
    <defs>
      <marker id="mate-arrow" markerWidth="7" markerHeight="7" refX="5.5" refY="3" orient="auto">
        <path d="M0,0 L6,3 L0,6 Z" fill="{{ strokeColor }}"></path>
      </marker>
    </defs>
    <path d="M6,40 C 78,40 142,40 210,40" fill="none" stroke="{{ strokeColor }}" stroke-width="1.5" stroke-dasharray="{{ dash }}" marker-end="url(#mate-arrow)" opacity="0.85"></path>
  </svg>
  <span style="position:relative;z-index:1;padding:2px 9px;border-radius:5px;font-family:'JetBrains Mono',monospace;font-size:10.5px;font-weight:500;letter-spacing:.03em;color:#C7CAD0;background:#1A1410;border:1px solid #3A2F26">{{ label }}</span>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:240,&quot;height&quot;:90},&quot;label&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;pasa: plan&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;active&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const active = this.props.active ?? false;
    return {
      label: this.props.label ?? 'contexto',
      strokeColor: active ? '#8B7BFF' : '#4A3D31',
      dash: active ? '4 4' : '0',
    };
  }
}
</script>
</body>
</html>

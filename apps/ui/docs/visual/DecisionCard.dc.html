<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
</helmet>
<div style="width:100%;box-sizing:border-box;background:#FFFFFF;border:1px solid #E1E7EE;border-radius:10px;padding:14px 15px;font-family:Nunito,sans-serif">
  <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px">
    <span style="font-family:'JetBrains Mono',monospace;font-size:10.5px;color:#95A0AE;letter-spacing:.03em">{{ id }}</span>
    <span style="display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:700;background:{{ stBg }};color:{{ stFg }};border:1px solid {{ stBd }}">
      <span style="width:6px;height:6px;border-radius:50%;background:{{ stFg }}"></span>{{ stLabel }}
    </span>
  </div>
  <div style="font-family:Fredoka,sans-serif;font-weight:600;font-size:16px;color:#1A1D24;line-height:1.2">{{ title }}</div>
  <sc-if value="{{ summary }}" hint-placeholder-val="{{ true }}">
    <div style="font-size:12.5px;color:#7A8694;line-height:1.5;margin-top:7px">{{ summary }}</div>
  </sc-if>
  <div style="display:flex;align-items:center;gap:8px;margin-top:12px;padding-top:11px;border-top:1px solid #E1E7EE">
    <span style="display:inline-flex;align-items:center;gap:6px;font-family:'JetBrains Mono',monospace;font-size:11px;color:#5A6675">
      <span aria-hidden="true" style="color:#4B54D4">◇</span>{{ relations }} piezas de código cumplen
    </span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:320,&quot;height&quot;:180},&quot;id&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;DEC-014&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;title&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Autenticación por token firmado&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;status&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;borrador&quot;,&quot;ratificada&quot;],&quot;default&quot;:&quot;ratificada&quot;,&quot;tsType&quot;:&quot;'borrador'|'ratificada'&quot;},&quot;summary&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;relations&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:3,&quot;min&quot;:0,&quot;max&quot;:99,&quot;tsType&quot;:&quot;number&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const status = this.props.status || 'ratificada';
    const smap = {
      borrador:   { label:'Borrador',   fg:'#9A6B15', bg:'#FBF1DC', bd:'rgba(217,150,58,.4)' },
      ratificada: { label:'Ratificada', fg:'#4A6B33', bg:'#EAF1E2', bd:'rgba(107,142,78,.45)' }
    };
    const s = smap[status] || smap.ratificada;
    return {
      id: this.props.id || 'DEC-014',
      title: this.props.title || 'Autenticación por token firmado',
      summary: this.props.summary || 'Toda sesión debe validar la firma del token contra el secreto del servidor antes de confiar en el usuario.',
      relations: this.props.relations != null ? this.props.relations : 3,
      stLabel: s.label, stFg: s.fg, stBg: s.bg, stBd: s.bd
    };
  }
}
</script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
</helmet>
<span style="display:inline-flex;align-items:center;gap:7px;padding:4px 10px 4px 5px;border-radius:6px;font-family:Nunito,sans-serif;font-size:12px;font-weight:700;line-height:1.2;background:{{ bg }};color:{{ fg }};border:1px solid {{ bd }}">
  <span aria-hidden="true" style="display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border-radius:4px;background:{{ bd }};color:#E8EEF4;font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:800">{{ icon }}</span>
  <span>{{ label }}</span>
  <sc-if value="{{ text }}" hint-placeholder-val="{{ true }}"><span style="font-weight:600;opacity:.82;font-size:11.5px">· {{ text }}</span></sc-if>
</span>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:300,&quot;height&quot;:64},&quot;level&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;critical&quot;,&quot;warning&quot;,&quot;suggestion&quot;,&quot;success&quot;],&quot;default&quot;:&quot;critical&quot;,&quot;tsType&quot;:&quot;'critical'|'warning'|'suggestion'|'success'&quot;},&quot;text&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;token faltante&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const level = this.props.level || 'critical';
    const map = {
      critical:   { bg:'#FBEAE6', fg:'#B23A28', bd:'#C4553D', icon:'!', label:'Crítico' },
      warning:    { bg:'#FBF1DC', fg:'#9A6B15', bd:'#D9963A', icon:'△', label:'Advertencia' },
      suggestion: { bg:'#E6F0F7', fg:'#2F6C97', bd:'#5B8DB8', icon:'i', label:'Sugerencia' },
      success:    { bg:'#EAF1E2', fg:'#4A6B33', bd:'#6B8E4E', icon:'✓', label:'Cumple' }
    };
    const t = map[level] || map.critical;
    return { ...t, text: this.props.text || '' };
  }
}
</script>
</body>
</html>

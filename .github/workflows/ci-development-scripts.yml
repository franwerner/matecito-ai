name: ci-development-scripts

on:
  push:
    paths:
      - 'payload/domains/development/scripts/**'
      - 'payload/domains/development/dev-tests/**'
      - 'payload/domains/development/references/artifact-checks/**'
      - 'payload/domains/development/references/phase-returns/**'
      - '.github/workflows/ci-development-scripts.yml'

permissions:
  contents: read

jobs:
  dev-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Test
        run: node --test payload/domains/development/dev-tests/

name: ci-broker

on:
  pull_request:
    paths:
      - 'apps/api/**'
      - '.github/workflows/ci-broker.yml'

permissions:
  contents: read

env:
  GOLANGCI_LINT_VERSION: v2.12.2
  GO_ARCH_LINT_VERSION: v1.16.0

jobs:
  broker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/api/go.mod
          cache: true

      - name: Module drift
        run: go mod tidy -diff

      - name: Architecture
        run: go run github.com/fe3dback/go-arch-lint@${{ env.GO_ARCH_LINT_VERSION }} check --project-path .

      # goinstall (not the released binary): the published binaries are built
      # with an older Go than this module targets, and golangci-lint refuses to
      # lint a module whose language version is newer than its own.
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          install-mode: goinstall
          working-directory: apps/api

      - name: Test
        run: go test ./...

      - name: Build
        run: go build ./...
